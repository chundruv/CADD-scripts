---
# MMSplice Environment - Optimized
# For splice site prediction with TensorFlow 2.x
name: mmsplice
channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # Python and core scientific libraries
  - python>=3.9,<3.12
  - numpy
  - pandas
  - scipy
  - click
  - pyyaml
  - tqdm

  # TensorFlow 2.x with GPU support (auto-detects CUDA)
  # For CPU-only: use tensorflow-cpu instead
  # Pinned exact so pip (via mmsplice's unpinned tensorflow dep) doesn't backtrack across releases
  - tensorflow=2.11.0

  # Bioinformatics packages
  - htslib
  - pysam
  - cyvcf2<=0.30.15  # mmsplice pins cyvcf2<=0.30.15; keep conda's build in range so pip won't rebuild it
  - pybedtools

  # HDF5 for model weights
  - h5py
  - hdf5

  # Package manager
  - pip

  # Python packages via pip
  - pip:
      # Pinned exactly: prevents pip's resolver from backtracking through ancient
      # mmsplice/tensorflow/scikit-learn releases that fail to build on modern Python
      - mmsplice==2.4.0
      - tensorflow==2.11.0
      - scikit-learn>=1.0
      - concise>=0.6.9  # For sequence encoding

      # VCF and sequence handling
      - pyfaidx
      - kipoiseq

      # Genomic intervals and annotations
      - pyranges
      - gffutils

      # Utilities
      - coloredlogs
